# Available Log Levels:
# * WARN   : Logs warnings and errors
# * INFO   : Standard logging + warnings and errors
# * DEBUG  : Logs detailed information useful for debugging issues
log-level: INFO

# =================================================================== #
#                      CURRENCY AND ECONOMY                           #
# =================================================================== #
# type :
# ITEM - shops will use a specified item as the currency (default is Diamond). To change this item in-game, run the
#        command '/shop setcurrency while holding the item in your hand you want to use as currency.
# VAULT - shops will use Vault as the currency. (This requires Vault to be installed on the server)
# EXPERIENCE - shops will use experience points as the currency

currency:
  #the type of currency to use (name for currencies is defined in the specific lang file of the plugin
  type: ITEM

# This formats suffixes for large numbers like (5,000 = 5k) or (5,000,000 = 5M)
price-suffixes:
  k: 1000
  M: 1000000
  B: 1000000000
  T: 1000000000000
  P: 1000000000000000
  E: 1000000000000000000

# =================================================================== #
#                           SHOP                                      #
# =================================================================== #
# This will change the type of item display that shops will use by default above their chests #
# The options are: NONE, ITEM, GLASS_CASE, LARGE_ITEM, ITEM_FRAME #
#if set to true uses the clients locale to display material names
use-localized-material-names: false

# (default: false) Should owners be able to buy/sell from their own shop
allow-use-own-shop: false

# If this is set to true, shops will require you to be sneaking (holding 'shift') to destroy them
destroy-shop-requires-sneak: true

cost:
  # cost of destroying a shop
  destroy: 0
  # cost of creating a shop
  create: 0
  # if creation cost should be returned when shop destroyed
  return-creation-cost: false
# shop display related settings
display:
  # default display for new shops
  type: NONE
  # This will change the order that display types are cycled in #
  # To remove a display type as a cycle option, remove it from this list #
  # The options are: NONE, ITEM, GLASS_CASE, LARGE_ITEM, ITEM_FRAME #
  cycle:
    - NONE
    - ITEM
    - GLASS_CASE
    - LARGE_ITEM
    - ITEM_FRAME
  # This controls what light level (0 to 15) shop displays emit #
  light-level: 0
  # This controls whether the item frames of shop displays are glowing #
  glowing-item-frame: false

#settings for the shop sign
sign:
  # This controls whether shop sign text should be glowing by default #
  # Signs on Bedrock Edition might look dimmed out
  glowing-sign-text: false

  #Controls if the sign should be auto waxed after creation
  waxed-sign: true

  #the line format shops need to abide by when being created every line can be a list of possible options of multiple permutations are allowed, placeholders:
  # %price% - the price to pay (positive value including 0) needs to be standalone on a sign line and cannot be used in the first line
  # %amount% - the item amount being given (positive value above 0) needs to be standalone on a sign line and cannot be used in the first line
creation-layout:
  # Each shop type can have multiple layouts that are "valid".
  sell:
    # Declarations for normal shops.
    normal:
      # Multiple values can be defined per line, making them alternatives.
      - 1: [ "shop", "[shop]" ]
        2: [ "%amount%" ]
        3: [ "%price%" ]
        4: [ "sell" ]

      - 1: [ "shop", "[shop]", "sell shop" ]
        2: [ "%amount%" ]
        3: [ "%price%" ]
        4: [ "" ]

    # Declarations for admin shops.
    admin:
      - 1: [ "shop" ]
        2: [ "%amount%" ]
        3: [ "%price%" ]
        4: [ "sell admin" ]

      - 1: [ "admin sell shop" ]
        2: [ "%amount%" ]
        3: [ "%price%" ]
        4: [ "" ]

  buy:
    normal:
      - 1: [ "shop", "[shop]", "buy shop" ]
        2: [ "%amount%" ]
        3: [ "%price%" ]
        4: [ "buy" ]

      - 1: [ "buy shop" ]
        2: [ "%amount%" ]
        3: [ "%price%" ]
        4: [ "" ]

    admin:
      - 1: [ "shop" ]
        2: [ "%amount%" ]
        3: [ "%price%" ]
        4: [ "buy admin" ]

      - 1: [ "admin buy shop" ]
        2: [ "%amount%" ]
        3: [ "%price%" ]
        4: [ "" ]

  barter:
    normal:
      - 1: [ "shop", "[shop]", "barter shop" ]
        2: [ "%amount%" ]
        3: [ "%price%" ]
        4: [ "barter" ]

      - 1: [ "barter shop" ]
        2: [ "%amount%" ]
        3: [ "%price%" ]
        4: [ "" ]

    admin:
      - 1: [ "shop" ]
        2: [ "%amount%" ]
        3: [ "%price%" ]
        4: [ "barter admin" ]

      - 1: [ "admin barter shop" ]
        2: [ "%amount%" ]
        3: [ "%price%" ]
        4: [ "" ]

  # Gamble shops are always admin shops.
  gamble:
    admin:
      - 1: [ "shop", "[shop]" ]
        2: [ "" ]
        3: [ "%price%" ]
        4: [ "gamble" ]

      - 1: [ "gamble shop" ]
        2: [ "" ]
        3: [ "%price%" ]
        4: [ "" ]
# =================================================================== #
#                         SHOP INTERACTIONS                           #
# =================================================================== #
# Here you can map player actions on shops to specific controls
#   - NONE
#   - LEFT_CLICK_SIGN
#   - SHIFT_LEFT_CLICK_SIGN
#   - RIGHT_CLICK_SIGN
#   - SHIFT_RIGHT_CLICK_SIGN
#
#   - LEFT_CLICK_CHEST
#   - SHIFT_LEFT_CLICK_CHEST
#   - RIGHT_CLICK_CHEST
#   - SHIFT_RIGHT_CLICK_CHEST
mappings:
  #clicks used to trade with a shop
  transact-with-shop:
    - RIGHT_CLICK_SIGN
  transact-with-shop-full-stack:
    - SHIFT_RIGHT_CLICK_SIGN
  #view details about a shop
  view-shop-details:
    - LEFT_CLICK_CHEST
  #cycle displays on a shop
  cycle-shop-display:
    - SHIFT_RIGHT_CLICK_CHEST
  #opens a gui for shop settings
  open-shop-settings:
    - SHIFT_LEFT_CLICK_CHEST

# These will play sounds and particle effects when creating and using shops
play-sounds: true
play-effects: true

# Shop settings, their default values and if they should be enabled
shop:
  settings:
    # how often a player can purchase from a given shop (each player has their own counter)
    transaction-limit:
      enabled: true
      default-value: 10
    # how long the player needs to wait between purchases to buy again from this shop
    transaction-cooldown:
      enabled: true
      default-value: 1d
    # if the shop should notify the owner when someone tries to transact and the shop ran out of stock.
    out-of-stock-notification:
      enabled: true
      default-value: true
    # if the shop should notify its owner over every transaction
    transaction-notification:
      enabled: true
      default-value: true

    #if shop items tagged with custom item id's by other plugins such as "Nexo items" should update their item definitions alongside the plugin
    custom-item-updater:
      enabled: true
      default-value: true

# =================================================================== #
#                                FILTERS                              #
# =================================================================== #
# Add the names of worlds that you do not want shops to be able to be created in here #
world-blacklist:
  - "example_world"
  - "example2_world"

# These are the different types of containers that can be used for shops #
enabled-containers:
  - BARREL
  - CHEST
  - TRAPPED_CHEST
  - SHULKER_BOX
  - BLACK_SHULKER_BOX
  - BLUE_SHULKER_BOX
  - BROWN_SHULKER_BOX
  - CYAN_SHULKER_BOX
  - GRAY_SHULKER_BOX
  - GREEN_SHULKER_BOX
  - LIGHT_BLUE_SHULKER_BOX
  - LIGHT_GRAY_SHULKER_BOX
  - LIME_SHULKER_BOX
  - MAGENTA_SHULKER_BOX
  - ORANGE_SHULKER_BOX
  - PINK_SHULKER_BOX
  - PURPLE_SHULKER_BOX
  - RED_SHULKER_BOX
  - WHITE_SHULKER_BOX
  - YELLOW_SHULKER_BOX

material-blacklist:
  materials:
    - COMMAND_BLOCK

material-whitelist:
  materials:

# =================================================================== #
#                   SHOP PERFORMANCE OPTIMIZATIONS                    #
# =================================================================== #
# You should not need to change these settings, we have tried to balance them for performance & experience. #
# If you are experiencing performance issues however, you can try to tune them. #

# How often (in seconds) to check for shop displays that need to be shown to players
# Lower values make shop displays appear faster.
# You can increase this if you are experiencing performance issues to reduce the number of checks.
display-process-interval: 1

# How far a player needs to move (in blocks) before shop display checks should be processed
# This prevents unnecessary processing when players are standing still
# Recommended range: 1-4, default: 1.0
display-movement-threshold: 1.0

# Maximum distance (in chunks) at which shop displays will be shown to players.
# affects when shop displays are shown and when shop signs send updated text to each player
max-shop-processing-distance-chunks: 1

# =================================================================== #
#                               MIGRATION                             #
# =================================================================== #
# THIS SHOULD ONLY BE ENABLED IF YOU KNOW WHAT YOU ARE DOING
# ==INSTRUCTIONS==
#  rename the old shop plugins data folder to "Shop-old" then start the server or reload the plugin, the old shop plugin should no longer be active on the server.RUN THIS ONLY ONCE to convert the old data!
# this setting will turn itself back to false after a successful transfer
migrate-old-data: false

