      destroy: "<gray>You have destroyed your selling shop."
      opDestroy: "<gray>You have destroyed a selling shop owned by %owner%."
      opOpen: "<gray>You are opening a selling shop owned by %owner%."
    buy:
      initialize: "<gold>Now just hit the sign with the item you want to buy from other players!"
      create: "<yellow>You have created a shop that buys <gold>%item%(s)<aqua>%item-enchants%<yellow>."
      destroy: "<gray>You have destroyed your buying shop."
      opDestroy: "<gray>You have destroyed a buying shop owned by %owner%."
      opOpen: "<gray>You are opening a buying shop owned by %owner%."
    barter:
      initialize: "<gold>Now hit the sign with the item you want to barter to other players!"
