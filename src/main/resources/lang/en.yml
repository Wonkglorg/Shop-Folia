permission:
  error:
    use: "<red>You are not authorized to use %shop-type% shops."
    create: "<red>You are not authorized to create shops."
    create-type: "<red>You are not authorized to create shops of type %shop-type%."
    destroy: "<red>You are not authorized to destroy your own shops."
    destroyOther: "<red>You are not authorized to destroy other players shops."
    openOther: "<red>You are not authorized to open other players shops."
    buildLimit: "<red>You reached your build limit of %user-amount%/%build-limit% shops."

hover:
  location:
    - '%item% <gray>(x%item-amount%)'
    - '<aqua>%item-enchants%'
    - '<gray>Type: <aqua>%shop-type%'
    - '<gray>Price: <green>%price%'
    - '%stock-color%%stock% in stock'
    - '<gray>%owner%'

command:
  usage:
    user:
      -"<blue>/shop list <gray>- list your shops on the server"
      -"<blue>/shop currency <gray>- info about the currency shops use"
      -"<blue>/shop currency <gray>- info about the currency shops use"
      -"<blue>/shop notify [user|owner|stock] <gray>- Toggles notifications"
    admin:
      -"<red>/shop setcurrency <gray>- set the currency item to item in hand"
      -"<red>/shop setgamble <gray>- set the gamble item display to item in hand"
      -"<red>/shop item refresh <gray>- refresh all display items on shops"
      -"<red>/shop reload <gray>- reload Shop plugin"
  list:
    success-console: "<white>There are <gold>%total-shops%<white> shops registered on the server."
    success-player:
      - "<white>There are <gold>%total-shops%<white> shops registered on the server."
      - "<gray>You have built <gold>%user-amount% <gray>out of your <gold>%build-limit% allotted shops."
  currency:
    success: "<gray>The server is using %currency-name% as currency."
    tip: "<gray>To change the currency, run the command '/shop setcurrency' with the item you want in your hand."
  set-currency:
    error-no-console: "<red>This command can only be executed by a player"
    error-digital-currency: "<red>The server is not using an item based currency so no item could be set."
    error-no-item-in-hand: "<red>You must hold a valid item to use that command."
    success: "<green>Set the servers currency to %held-item%"
  set-gamble:
    error-no-console: "<red>This command can only be executed by a player"
    error-no-item-in-hand: "<red>>You must hold a valid item to use that command."
    success: "<green>Set the servers currency to %held-item%"
  refresh-reload:
    success: "<green>The display items on all of the shops have been refreshed."
  reload:
    success: "<green>Reloaded Shops!"
  notify:
    usage:
      -"<blue>/shop notify user<gray>- shows transaction notifications when you interact with other shops"
      -"<blue>/shop notify owner<gray>- shows transaction notifications when players interact with your shops"
      -"<blue>/shop notify stock<gray>- shows notifications when your shop runs out of stock"
    user:
      success: "<gray>Your notifications for your own transactions with shops are now %notify-state%"
    owner:
      success: "<gray>Your notifications for players transacting with your shops are now %notify-state%"
    stock:
      success: "<gray>Your notifications for your shops running out of stock are now %notify-state%"

#sign texts to render on shops, these are player specific based on their current relation to the shop
# each entry must be a list of 4 entries
sign:
  text:
    timeout:
      1: "<red> TIMEOUT"
      2: "<red> TIMEOUT"
      3: "<red> TIMEOUT"
      4: "<red> TIMEOUT"
    sell:
      # when the shop is in its initialization state
      initialise:
        1: "<red><bold>[sell shop]"
        2: "<red>%item%<red>: %amount%"
        3: "<red>%price% %currency-name%"
        4: "<red>%owner%"
      # when the shop is in stock and has a display rendered
      in-stock:
        1: "%in-stock-color%<bold>[shop]"
        2: "<white>Selling: <bold>%amount%"
        3: "%shop-price-display%"
        4: "<white>%owner%"
      # when the shop is in stock and has no display rendered
      in-stock-no-display:
        1: "%in-stock-color%<bold>[sell shop]"
        2: "<white>%item%<white>: %amount%"
        3: "%shop-price-display%"
        4: "<white>%owner%"
      # when the shop is not in stock and has a display rendered
      out-of-stock:
        1: "%out-of-stock-color%<bold>[shop]"
        2: "<white>Selling: <bold>%amount%"
        3: "%shop-price-display%"
        4: "<white>%owner%"
      # when the shop is not in stock and has no display rendered
      out-of-stock-no-display:
        1: "%out-of-stock-color%<bold>[sell shop]"
        2: "<white>%item%<white>: %amount%"
        3: "%shop-price-display%"
        4: "<white>%owner%"
      # when the shop is in stock and has a display rendered
      overfilled:
        1: "%overfilled-stock-color%<bold>[shop]"
        2: "<white>Selling: <bold>%amount%"
        3: "%shop-price-display%"
        4: "<white>%owner%"
      # when the shop is in stock and has no display rendered
      overfilled-no-display:
        1: "%overfilled-stock-color%<bold>[sell shop]"
        2: "<white>%item%<white>: %amount%"
        3: "%shop-price-display%"
