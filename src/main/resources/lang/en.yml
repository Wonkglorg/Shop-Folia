# THIS FILE IS USED TO CONFIGURE WHAT MESSAGES ARE DISPLAYED #
# ================================================================== #
# Config supports mini message
placeholders:
  currency-name: "<aqua>Diamond(s)"
  in-stock-color: "<green>"
  out-of-stock-color: "<red>"
  overfilled-stock-color: "<gold>"
  zero-price: "<aqua>FREE"
  admin-stock: "unlimited"
  server-display-name: "<light_purple>Server"
  shop-owner-name-color: "<white>"
  closed-shop: "<red>CLOSED"
templates:
  shop-price-display: "[if:%price%==0]%zero-price%[else]<aqua>%price% %currency-name%[/if]"

##Shop transaction related messages
transaction:
  success:
    sell:
      user: '<gray>You bought <white>%item-amount% %item%(s)<aqua>%item-enchants% <gray>from %owner% for %shop-price-display%<gray>.'
      owner: '<gray>%user% bought <white>%item-amount% %item%(s)<aqua>%item-enchants% <gray>from you for %shop-price-display%<gray> at <white>%location%<gray>.'
    buy:
      user: '<gray>You sold <white>%item-amount% %item%(s)<aqua>%item-enchants% <gray>to %owner% for %shop-price-display%<gray>.'
      owner: '<gray>%user% sold <white>%item-amount% %item%(s)<aqua>%item-enchants% <gray>to you for %shop-price-display%<gray> at <white>%location%<gray>.'
    barter:
      user: '<gray>You bartered <white>%barter-item-amount% <gray>of your <white>%barter-item%(s)<aqua>%barter-item-enchants% <gray>for <white>%item-amount% <gray>of %owner%s <white>%item%(s)<aqua>%item-enchants%<gray>.'
      owner: '<gray>%user% bartered <white>%barter-item-amount% <gray>of their <white>%barter item%(s)<aqua>%barter-item-enchants% <gray>for <white>%item-amount% <gray>of your <white>%item%(s)<aqua>%item-enchants%<gray> at <white>%location%<gray>.'
    gamble:
      user: '<gray>You gambled %shop-price-display% <gray>and received <white>%item%<gray>(x%item-amount%)<aqua>%item-enchants%.'
  issue:
    sell:
      useOwnShop: "<gray>You cannot use your own shop."
      shopPerformingTransaction: "<red>Shop is transacting with another player."
      playerCooldown: "<red>You can't trade with this shop for another %duration%!"
      playerTransactionLimit: "<red>You reached your trading limit with this shop (%current-trade-count%/%total-trade-count%)!"
      cancelledExternal: "<gray>Transaction cancelled."
      shopNoStock: "<red>This shop is out of stock."
      ownerNoStock: "<red>[Shop] Your selling shop at %location% is out of stock."
      shopNoSpace: "<red>This shop does not have enough space in its inventory to accept your payment."
      ownerNoSpace: "<red>[Shop] Your selling shop at %location% is full."
      playerNoStock: "<red>You do not have sufficient funds to buy from this shop."
      playerNoSpace: "<red>You do not have enough space in your inventory to buy from this shop."
    buy:
      useOwnShop: "<gray>You cannot use your own shop."
      shopPerformingTransaction: "<red>Shop is transacting with another player."
      playerCooldown: "<red>You can't trade with this shop for another %duration%!"
      playerTransactionLimit: "<red>You reached your trading limit with this shop (%current-trade-count%/%total-trade-count%)!"
      cancelledExternal: "<gray>Transaction cancelled."
      shopNoStock: "<red>This shop is out of funds."
      ownerNoStock: "<red>[Shop] Your buying shop at %location% is out of funds."
      shopNoSpace: "<red>This shop does not have enough space in its inventory for your items."
      ownerNoSpace: "<red>[Shop] Your buying shop at %location% is full."
      playerNoStock: "<red>You do not have enough items to sell to this shop."
      playerNoSpace: "<red>You do not have enough space in your inventory to accept the payment from this shop."
    barter:
      useOwnShop: "<gray>You cannot use your own shop."
      shopPerformingTransaction: "<red>Shop is transacting with another player."
      playerCooldown: "<red>You can't trade with this shop for another %duration%!"
      playerTransactionLimit: "<red>You reached your trading limit with this shop (%current-trade-count%/%total-trade-count%)!"
      cancelledExternal: "<gray>Transaction cancelled."
      shopNoStock: "<red>This shop is out of stock."
      ownerNoStock: "<red>[Shop] Your barter shop at %location% is out of stock."
      shopNoSpace: "<red>This shop does not have enough space in its inventory to barter with you."
      ownerNoSpace: "<red>[Shop] Your barter shop at %location% is full."
      playerNoStock: "<red>You do not have sufficient items to barter with this shop."
      playerNoSpace: "<red>You do not have enough space in your inventory to barter with this shop."
    gamble:
      useOwnShop: "<gray>You cannot use your own shop."
      shopPerformingTransaction: "<red>Shop is transacting with another player."
      playerCooldown: "<red>You can't trade with this shop for another %duration%!"
      playerTransactionLimit: "<red>You reached your trading limit with this shop (%current-trade-count%/%total-trade-count%)!"
