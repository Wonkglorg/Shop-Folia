      destroy: "<gray>You have destroyed your bartering shop."
      opDestroy: "<gray>You have destroyed a bartering shop owned by %owner%."
      opOpen: "<gray>You are opening a bartering shop owned by %owner%."
    gamble:
      create: "<yellow>You have created a gambling shop."
      opDestroy: "<gray>You have destroyed a gambling shop owned by %server-name%."
  issues:
    createLine2: "<red>The amount (line 2) needs to be a positive number."
    createLine3: "<red>The price (line 3) needs to be a positive number."
    createNoItem: "<red>You must be holding the item you want to %shop type%"
    createDirection: "<red>The sign must be in front of the chest in order to create a shop."
    createSameItem: "<red>You cannot create a barter shop where both items are the same."
    createDisplayRoom: "<red>This shop could not created because there is no room for a display item."
    createSignRoom: "<red>This shop could not created because there is no room for a wall sign."
    createOtherShop: "<red>You may not create a shop on the same chest as another player."
    createInsufficientFunds: "<red>You do not have the funds required to create this shop."
    createCancel: "<red>Cancelled shop creation."
    destroyInsufficientFunds: "<red>You do not have the funds required to destroy this shop."
    initializeOtherShop: "<red>You may not initialize another players shop with an item."
    useShopAlreadyInUse: "<red>This shop is in the middle of a transaction."
    destroySignRequiresSneak: "<red>You must sneak to destroy this shop sign."
    destroyChest: "<red>You must remove the sign from this shop to break it."
    destroyChestOther: "<red>Only the owner of this shop can destroy it."
    destroyUninitializedChest: "<red>This chest cannot be destroyed while a shop is being created for it."
    adminOpen: "<gray>Admin shops are not able to be opened."
    worldBlacklist: "<red>Shops are not allowed to be created in this world."
    regionRestriction: "<red>You do not have permission to do that in this region."
    itemFilterDeny: "<red>This item is disabled for shop usage!"
    createHitChestTimeout: "<gray>The shop you started to create at %location% has timed out."

