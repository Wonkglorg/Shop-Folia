    - '<light_purple>| <gray>Price: <green>%price% <gray>(%price-per-item% per 1 <gray>%item%)'
    - '<light_purple>| <gray>Stock: %stock-color%%stock%'
    - '<light_purple>+---------------------------------------------------+'
