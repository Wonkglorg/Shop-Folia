gamble-display-item:
  ==: org.bukkit.inventory.ItemStack
  DataVersion: 4903
  id: minecraft:diamond
  count: 1
  schema_version: 1

#The item to use as currency if currency is set to a physical item
currency-items:
  #base
  base:
    ==: org.bukkit.inventory.ItemStack
    DataVersion: 4903
    id: minecraft:diamond
    count: 1
    schema_version: 1
  #Optional items that represent a multiple of the base items worth, such as a diamond block being considered 9x the worth of a single diamond as currency,
  # any number of items can be specified as multiples.
  condensed:
    diamond_block:
      # how many instances of the basic currency item this one is worth
      multiplier: 9
      # the item representing this amount
      item:
        ==: org.bukkit.inventory.ItemStack
        DataVersion: 4903
        id: minecraft:diamond_block
        count: 1
        schema_version: 1

# Components of an Itemstack that should be ignored when matching for equality in shop transactions based on the provided material
# Full component list: https://minecraft.wiki/w/Data_component_format
ignored-components:
  tadpole_bucket:
    - bucket_entity_data
  cod_bucket:
    - bucket_entity_data
  salmon_bucket:
    - bucket_entity_data
  tropical_fish_bucket:
    - bucket_entity_data
    - tropical_fish/base_color
    - tropical_fish/pattern
    - tropical_fish/pattern_color
  pufferfish_bucket:
    - bucket_entity_data
  sulfur_cube_bucket:
    - bucket_entity_data
    - sulfur_cube_content
# Define any custom items here that should be usable by shop initialization commands alongside vanilla items, changes to these need a complete server restart to apply!
# ==== SUPPORTS ====
# Supports full item definitions via itemstack definition  as seen below in the examples or via a plugins namespace
# currently supports
# nexo: for nexo items
# hmcwraps: for hmcwraps
# ==== EXAMPLES ====
#
#   custom_diamond:
#    ==: org.bukkit.inventory.ItemStack
#    DataVersion: 4903
#    id: minecraft:diamond
#    count: 1
#    schema_version: 1
#  arcanite_sword: "nexo:arcanite_sword"
#  fire_sword_wrap: "hmcwraps:fire_sword"
custom-item-definitions:
  custom_diamond:
    ==: org.bukkit.inventory.ItemStack
    DataVersion: 4903
    id: minecraft:diamond
    count: 1
    schema_version: 1

  arcanite_sword: "nexo:arcanite_sword"
  fire_sword_wrap: "hmcwraps:fire_sword"