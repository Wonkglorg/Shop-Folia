plugins {
    id 'java'
    id 'maven-publish'
    id("xyz.jpenilla.run-paper") version "3.1.0"
    id("com.gradleup.shadow") version "9.2.2"
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.21" apply false
}

/*
|--------------------------------------------------------------------------
| Feature Flags
|--------------------------------------------------------------------------
*/

def usePaperweight = providers.gradleProperty("usePaperweight")
        .map { it.toBoolean() }
        .getOrElse(false)

def enableUtils = providers.gradleProperty("enable_utils")
        .map { it.toBoolean() }
        .getOrElse(false)

def enableDate = providers.gradleProperty("enable_date")
        .map { it.toBoolean() }
        .getOrElse(false)

def enableConfig = providers.gradleProperty("enable_config")
        .map { it.toBoolean() }
        .getOrElse(false)

def enableCommand = providers.gradleProperty("enable_command")
        .map { it.toBoolean() }
        .getOrElse(false)

def enableGui = providers.gradleProperty("enable_gui")
        .map { it.toBoolean() }
        .getOrElse(false)

def enableDatabase = providers.gradleProperty("enable_database")
        .map { it.toBoolean() }
        .getOrElse(false)

if (usePaperweight) {
    apply plugin: "io.papermc.paperweight.userdev"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
}

group = group_name
version = plugin_version

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "codemc-repo"
        url = "https://repo.codemc.io/repository/maven-public/"
    }
    maven {
        name = "jitpack.io"
        url = "https://jitpack.io"
    }
    maven {
        name = "ender-zone-repo"
        url = "https://ci.ender.zone/plugin/repository/everything/"
    }

    maven {
        name = "nexo-items-repo"
        url = "https://repo.nexomc.com/releases"
    }

    maven {
        name = "hmc-wraps-repo"
        url = "https://repo.hibiscusmc.com/releases/"
    }

    maven {
        name = "geyser-repo"
        url = uri("https://repo.opencollab.dev/main/")
    }
}

dependencies {
    if (usePaperweight) {
        paperweight.paperDevBundle("${minecraft_version}.build.+")
    } else {
        compileOnly "io.papermc.paper:paper-api:${minecraft_version}.build.+"
    }

    if (enableUtils) {
        implementation "com.github.WonkyLibs:Util:${utils_version}"
    }

    if (enableDate) {
        implementation "com.github.WonkyLibs:Date:${date_version}"
    }
    if (enableConfig) {
        implementation "com.github.WonkyLibs:Config:${config_version}"
    }

    if (enableCommand) {
        implementation "com.github.WonkyLibs:Command:${command_version}"
    }

    if (enableGui) {
        implementation "com.github.WonkyLibs:GUI:${gui_version}"
    }

    if (enableDatabase) {
        implementation "com.github.Wonkglorg:DatabaseUtils:${databaseutils_version}"
    }
    compileOnly "org.jetbrains:annotations:${jetbrains_annotation_version}"
    compileOnly "org.projectlombok:lombok:${lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${lombok_version}"

    //Core dependencies
    compileOnly 'net.milkbowl.vault:VaultAPI:1.7'

    //FoliaLib
    implementation 'com.github.technicallycoded:FoliaLib:0.4.4'

    //Plugin Dependencies
    compileOnly "org.geysermc.floodgate:api:${floodgate_version}"
    compileOnly "org.geysermc.geyser:api:${geyser_version}"

    //Custom item Dependencies
    compileOnly "com.nexomc:nexo:${nexo_version}"
    compileOnly "de.skyslycer.hmcwraps:api:${hmcwraps_version}"

    //test dependencies
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    testImplementation "net.milkbowl.vault:VaultAPI:1.7"
    testImplementation "org.mockito:mockito-core:${mockito_version}"
}

tasks.named('runServer') {
    minecraftVersion(minecraft_version)

    jvmArgs('-Dcom.mojang.eula.agree=true')

    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }

    runDirectory.set(file("$projectDir/run"))
}

test {
    useJUnitPlatform()
}

def mineflayerTests = file("$projectDir/mineflayer-tests")

def gradlewPath = System.getProperty('os.name').toLowerCase().contains('windows') ? "$projectDir/gradlew.bat" : "$projectDir/gradlew"

def npmCommand = providers.gradleProperty('npm_path').getOrElse('npm')
def nodejsPath = providers.gradleProperty('nodejs.path').orNull

def testServerDirectory = file("$projectDir/run")

def testServerProperties = file("$testServerDirectory/server.properties")

tasks.register('configureTestServer') {
    outputs.file(testServerProperties)

    doLast {
        testServerDirectory.mkdirs()

        def properties = new Properties()

        if (testServerProperties.exists()) {
            testServerProperties.withInputStream {
                properties.load(it)
            }
        }

        properties.setProperty('online-mode', 'false')
        properties.setProperty('difficulty', 'peaceful')
        properties.setProperty('gamemode', 'creative')
        properties.setProperty('server-port', '25565')
        properties.setProperty('level-type', 'minecraft:flat')
        properties.setProperty('generator-settings', '{}')

        testServerProperties.withOutputStream {
            properties.store(it, 'Mineflayer integration test server')
        }
    }
}

tasks.register('installMineflayerDependencies', Exec) {
    workingDir(mineflayerTests)

    commandLine(npmCommand,
            'install')
}

tasks.register('integrationTest') {
    group = 'verification'
    description = 'Runs the Mineflayer integration tests against Paper'

    dependsOn('build',
            'installMineflayerDependencies',
            'configureTestServer')

    doLast {
        def serverProcess

        if (System.getProperty('os.name').toLowerCase().contains('windows')) {
            serverProcess = new ProcessBuilder('cmd.exe',
                    '/c',
                    gradlewPath,
                    'runServer',
                    '--console=plain',
                    '--no-daemon')
                    .directory(projectDir)
                    .redirectError(ProcessBuilder.Redirect.INHERIT)
                    .redirectOutput(ProcessBuilder.Redirect.INHERIT)
                    .start()
        } else {
            serverProcess = new ProcessBuilder(gradlewPath,
                    'runServer',
                    '--console=plain',
                    '--no-daemon')
                    .directory(projectDir)
                    .redirectError(ProcessBuilder.Redirect.INHERIT)
                    .redirectOutput(ProcessBuilder.Redirect.INHERIT)
                    .start()
        }

        try {
            def timeout = System.currentTimeMillis() + 60_000
            def serverReady = false

            while (System.currentTimeMillis() < timeout) {
                if (!serverProcess.isAlive()) {
                    def exitCode = serverProcess.exitValue()

                    throw new GradleException(
                            "Paper process exited before the server became ready. Exit code: ${exitCode}"
                    )
                }

                try {
                    def socket = new Socket('127.0.0.1', 25565)
                    socket.close()

                    // The port is open, but Paper may still be finishing startup.
                    // Give Paper a little time to finish loading.
                    Thread.sleep(2_000)

                    serverReady = true
                    break
                } catch (Exception ignored) {
                    Thread.sleep(250)
                }
            }

            if (!serverReady) {
                throw new GradleException(
                        'Paper did not start listening on port 25565 within 60 seconds'
                )
            }

            println ''
            println 'Paper is ready'
            println 'Making Bot an operator'

            serverProcess.outputStream.write("op Bot\n".getBytes())
            serverProcess.outputStream.flush()

            Thread.sleep(1_000)

            println 'Running Mineflayer integration tests...'
            def testBuilder = new ProcessBuilder(npmCommand,
                    'test')
                    .directory(mineflayerTests)
                    .redirectErrorStream(true)

            if (nodejsPath != null) {
                def currentPath = testBuilder.environment().get('PATH', '')

                testBuilder.environment().put('PATH',
                        nodejsPath.toString() + ';' + currentPath.toString())
            }

            def testProcess = testBuilder.start()

            testProcess.inputStream.eachLine { line -> println "[Mineflayer] ${line}"
            }

            def testExitCode = testProcess.waitFor()

            if (testExitCode != 0) {
                throw new GradleException("Mineflayer integration tests failed with exit code ${testExitCode}")
            }
        } finally {
            def processes = serverProcess.toHandle()
                    .descendants()
                    .collect { it }

            processes.each {
                it.destroy()
            }

            serverProcess.destroy()

            processes.each {
                try {
                    it.onExit().get()
                } catch (Exception ignored) {
                }
            }

            if (serverProcess.isAlive()) {
                serverProcess.destroyForcibly()
            }
        }
    }
}

processResources {
    def props = [version         : version,
                 minecraftVersion: minecraft_version,
                 name            : plugin_name,
                 api_version     : plugin_api_version,
                 description     : plugin_description,
                 author          : author

    ]
    inputs.properties props
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.named("jar") {
    enabled = false
}

def jarOutputDir = providers.gradleProperty("jar_output_dir")
        .getOrElse("$buildDir/libs")

tasks.named("shadowJar") {
    archiveClassifier.set("")

    destinationDirectory.set(file(jarOutputDir))

    relocate("com.tcoded.folialib", "com.wonkglorg.shop.lib.folialib")


    relocate("com.wonkglorg.minecraft.config", "com.wonkglorg.shop.lib.config")

    doLast {
        println("Shadow jar generated at: ${archiveFile.get().asFile.absolutePath}")
    }
}

tasks.named("build") {
    dependsOn("shadowJar")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact tasks.shadowJar
        }
    }
}

